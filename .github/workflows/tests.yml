name: Go Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run Linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Build
        run: go build -v ./cmd/app

      - name: Run Unit Tests
        run: go test -v -p 1 ./...

      - name: Run Integration Tests
        run: go test -v -p 1 -tags=integration ./...