services:
  # ---------------------------------------------------------------------------
  # Postgres
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: taskforge-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-taskforge_db}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-taskforge} -d $${POSTGRES_DB:-taskforge_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskforge-network

  redis:
    image: redis:8-alpine
    container_name: taskforge-redis
    restart: unless-stopped
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskforge-network

  # ---------------------------------------------------------------------------
  # task-forge service (Go)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskforge
    environment:
      # APP
      APP_PORT: 8081
      APP_SECRET: ${APP_SECRET}
      # DB
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: taskforge_db
      DB_USER: taskforge_app
      DB_PASSWORD: postgres_dev_password
      MIGRATIONS_AUTO: ${MIGRATIONS_AUTO:-true}
      # REDIS
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: 
      
      # # EMAIL
      # EMAIL_MODE: ${EMAIL_MODE:-smtp}
      # # MAILTRAP
      # MAILTRAP_API_KEY: ${MAILTRAP_API_KEY}
      # MAILTRAP_DOMAIN: ${MAILTRAP_DOMAIN:-hello@demomailtrap.co}
      # MAILTRAP_NAME: ${MAILTRAP_NAME:-taskforge}
      # # SMTP
      # SMTP_HOST: ${SMTP_HOST:-mailpit}
      # SMTP_PORT: ${SMTP_PORT:-1025}
      # SMTP_FROM: ${SMTP_FROM:-yourapp@example.com}
      # SMTP_USER: ${SMTP_USER}
      # SMTP_PASSWORD: ${SMTP_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taskforge-network
    restart: unless-stopped

# ===========================================================================
# VOLUMES
# ===========================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  taskforge-network:
    driver: bridge
    name: taskforge-network
