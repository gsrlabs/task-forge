services:
  # ===========================================================================
  # PostgreSQL
  # ===========================================================================
  postgres:
    image: postgres:18-alpine
    container_name: taskforge-postgres
    restart: unless-stopped

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - taskforge-network


  # ===========================================================================
  # Redis
  # ===========================================================================
  redis:
    image: redis:8-alpine
    container_name: taskforge-redis
    restart: unless-stopped

    ports:
      - "${REDIS_PORT:-6379}:6379"

    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - "${REDIS_PASSWORD}"

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - taskforge-network


  # ===========================================================================
  # Task Forge API
  # ===========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: taskforge
    restart: unless-stopped

    environment:
      # -----------------------------------------------------------------------
      # Application
      # -----------------------------------------------------------------------
      APP_PORT: ${APP_PORT}
      APP_MODE: ${APP_MODE}
      APP_LOGGING_LEVEL: ${APP_LOGGING_LEVEL}

      # -----------------------------------------------------------------------
      # Authentication
      # -----------------------------------------------------------------------
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_JWT_EXPIRY: ${APP_JWT_EXPIRY}

      # -----------------------------------------------------------------------
      # PostgreSQL
      # -----------------------------------------------------------------------
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      # -----------------------------------------------------------------------
      # Migrations
      # -----------------------------------------------------------------------
      APP_MIGRATIONS_AUTO: ${APP_MIGRATIONS_AUTO}

      # -----------------------------------------------------------------------
      # Redis
      # -----------------------------------------------------------------------
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    ports:
      - "${APP_PORT}:8081"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - taskforge-network


# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  postgres_data:
    driver: local

  redis_data:
    driver: local


# ============================================================================
# NETWORK
# ============================================================================
networks:
  taskforge-network:
    driver: bridge
    name: taskforge-network

